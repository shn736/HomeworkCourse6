<!doctype html>
<html lang="ru">
  <head>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.0/font/bootstrap-icons.css">
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Заголовок страницы</title>
      <link href="css/bootstrap.min.css" rel="stylesheet"/>
  </head>
  <body>
    <div class="row align-items-start">
      <div class="col-2">
          <div class="card d-flex flex-column bg-primary-subtle vh-100">
              <div class="card-body">
                <h5 class="card-title bi bi-bootstrap-fill"> Меню</h5>
                  <div class ="text-left">
                      <div class="btn-group-vertical text-start" role="group" aria-label="Vertical button group">
                          <button type="button" class="btn bi bi-house text-start" data-bs-toggle="button"> Главная</button>
                          <button type="button" class="btn bi bi-speedometer2 text-start" data-bs-toggle="button"> Категории</button>
                          <button type="button" class="btn bi bi-table text-start" data-bs-toggle="button"> Заказы</button>
                          <button type="button" class="btn bi bi-person-circle text-start" data-bs-toggle="button"> Контакты</button>
                      </div>
                        <div class="mt-auto p-3">
                            <div class="dropdown">
                              <button class="btn btn-secondary dropdown-toggle position-fixed" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="bottom: 0; left: 0;">
                                Пользователь
                              </button>
                              <ul class="dropdown-menu dropdown-menu-dark">
                                <li><a class="dropdown-item active" href="#">Профиль</a></li>
                                <li><a class="dropdown-item" href="#">Выход</a></li>
                              </ul>
                            </div>
                        </div>
                  </div>
              </div>
          </div>
      </div>
          <div class="col-10 mt-5">
            <div class="row align-items-start">
              <h1 class="text-center mt-5">Контакты</h1>
              <div class="col-2"></div>
              <div class="col-4 mt-5">
                <div class="card text-bg-light">
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <input type="text" class="form-control" placeholder="Имя">
                            </div>
                            <div class="mb-3">
                                <input type="email" class="form-control" placeholder="Почта">
                            </div>

                            <div class="mb-3">
                                <textarea class="form-control" placeholder="Сообщение" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Отправить</button>
                        </form>
                    </div>
                </div>
              </div>
              <div class="col-1"></div>
              <div class="col-2 mt-5">
                <div class="card border-light mb-3" style="max-width: 18rem;">
                  <div class="card-body">
                    <h5 class="card-title">Наши контакты</h5>
                    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
                  </div>
                </div>
              </div>
              <div class="col-2"></div>
          </div>
    </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js">
        </script>
</div>

  </body>
</html>
